<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Game</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #FFFACD;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            text-align: center;
            display: none;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            image-rendering: pixelated;
        }
        
        #score {
            display: none;
        }
        
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 12px 50px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            min-width: 350px;
            color: white;
        }
        
        #game-over h2 {
            margin-bottom: 25px;
            font-size: 42px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            color: #ff4757;
        }
        
        #game-over p {
            font-size: 20px;
            margin: 10px 0;
            color: #ced4da;
        }

        #game-over span {
            font-weight: bold;
            color: #fff;
        }
        
        .controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #2F4F4F;
            font-size: 16px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid #2F4F4F;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .selection-container {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .selection-container h2 {
            margin-bottom: 25px;
            color: #2F4F4F;
        }
        
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 15px;
            margin-bottom: 30px;
        }
        
        .start-btn {
            background: #2ed573;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
        }
        
        .start-btn:hover {
            background: #26af5f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
        }
        
        .avatar-option {
            border: 2px solid #eee;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f8f9fa;
        }
        
        .avatar-option:hover {
            border-color: #2ed573;
            background: #fff;
            transform: scale(1.05);
        }
        
        .avatar-option.selected {
            border-color: #2ed573;
            background: #e7f9ee;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.2);
        }
        
        .avatar-preview {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .avatar-name {
            font-size: 14px;
            font-weight: 600;
            color: #2F4F4F;
        }

        .game-modifiers {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .modifier-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 24px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
        }

        .modifier-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .modifier-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- Écran de sélection d'avatar -->
    <div id="avatar-selection" class="overlay">
        <div class="selection-container">
            <h2>Choisissez votre avatar</h2>
            <div id="avatar-grid" class="avatar-grid"></div>
            <button id="btn-start" class="start-btn">Commencer le jeu</button>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game"></canvas>
        <div id="score">0</div>
        <div class="game-modifiers">
            <button id="toggle-time" class="modifier-btn" title="Cycle Jour/Nuit">🌙</button>
            <button id="cycle-weather" class="modifier-btn" title="Changer Météo">☁️</button>
            <button id="restart-game" class="modifier-btn" title="Recommencer">🔄</button>
        </div>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Score: <span id="final-score">0</span></p>
            <p>Meilleur score: <span id="best-score">0</span></p>
            <button id="restart-btn-gameover" class="start-btn">Rejouer</button>
        </div>
    </div>
    <div class="controls-hint">
        ESPACE ou ↑ = SAUTER | ↓ = S'ACCROUPIR | P = PAUSE | M = MUTE
    </div>
    
    <script type="module">
        import { AvatarManager } from './dist/AvatarManager.js';
        
        let selectedAvatarId = 'adventurer'; // Synchronisé avec AvatarManager.ts
        
        function initAvatarSelection() {
            const avatarManager = AvatarManager.getInstance();
            const avatars = avatarManager.getAvatars();
            const grid = document.getElementById('avatar-grid');
            
            grid.innerHTML = ''; // Nettoyer pour éviter les doublons si rappel

            avatars.forEach(avatar => {
                const option = document.createElement('div');
                option.className = 'avatar-option';
                option.dataset.avatarId = avatar.id;
                
                const preview = document.createElement('div');
                preview.className = 'avatar-preview';
                preview.textContent = getAvatarIcon(avatar);
                
                const name = document.createElement('div');
                name.className = 'avatar-name';
                name.textContent = avatar.name;
                
                option.appendChild(preview);
                option.appendChild(name);
                
                option.addEventListener('click', () => selectAvatar(avatar.id));
                
                grid.appendChild(option);
            });
            
            selectAvatar(selectedAvatarId);
            
            document.getElementById('btn-start').addEventListener('click', startGame);
        }
        
        function getAvatarIcon(avatar) {
            const icons = {
                'character': '👤',
                'adventurer': '🗡️',
                'female': '👩',
                'soldier': '⚔️',
                'robot': '🤖'
            };
            return icons[avatar.category] || '👤';
        }
        
        function selectAvatar(avatarId) {
            document.querySelectorAll('.avatar-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            const selectedOption = document.querySelector(`[data-avatar-id="${avatarId}"]`);
            if (selectedOption) {
                selectedOption.classList.add('selected');
            }
            
            selectedAvatarId = avatarId;
            const avatarManager = AvatarManager.getInstance();
            avatarManager.selectAvatar(avatarId);
        }
        
        function startGame() {
            document.getElementById('avatar-selection').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            
            import('./dist/game.js').then(module => {
                // Game logic starts automatically
            });
        }
        
        document.addEventListener('DOMContentLoaded', initAvatarSelection);
    </script>
</body>
</html>
